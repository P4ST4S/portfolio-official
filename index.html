<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Antoine Rospars, Software Engineer</title>
    <meta
      name="description"
      content="Software engineer chez Datakeen. SDK NFC pour pièces d'identité, plateforme KYC en production, et mcp-audit, proxy d'audit open source pour le Model Context Protocol."
    />
    <link rel="canonical" href="https://www.antoinerospars.dev/" />
    <!-- Discord colours its link previews with the first theme-color it finds, without checking media.
         Browsers skip this first one (it only matches print) and paint their bar with the black one below,
         the same black as the nav in both worlds. -->
    <meta name="theme-color" content="#8f1d14" media="print" />
    <meta name="theme-color" content="#050505" />

    <!-- Link previews (Discord, Slack, LinkedIn, X): a still of the title screen, see scripts/og.html -->
    <meta property="og:type" content="profile" />
    <meta property="og:site_name" content="antoinerospars.dev" />
    <meta property="og:locale" content="fr_FR" />
    <meta property="og:url" content="https://www.antoinerospars.dev/" />
    <meta property="og:title" content="Antoine Rospars, Software Engineer" />
    <meta
      property="og:description"
      content="Je construis ce qui vérifie : le SDK qui lit la puce de votre passeport, la plateforme KYC qui s’en sert, et mcp-audit, le proxy open source qui audite chaque appel d’outil de vos agents IA."
    />
    <meta property="og:image" content="https://www.antoinerospars.dev/og.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Antoine Rospars, software engineer chez Datakeen : son nom sur une route qui s’enfonce dans le brouillard."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      // Pick the world before first paint so the page never flashes the wrong one.
      ;(() => {
        let saved
        try {
          saved = localStorage.getItem('theme')
        } catch {}
        // 'paper' and 'uv' were the two themes of the previous version of the site
        if (saved === 'paper') saved = 'fog'
        if (saved === 'uv') saved = 'other'
        const other = saved ? saved === 'other' : matchMedia('(prefers-color-scheme: dark)').matches
        document.documentElement.dataset.theme = other ? 'other' : 'fog'
      })()
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Courier+Prime:ital,wght@0,400;0,700;1,400&family=Covered+By+Your+Grace&family=EB+Garamond:ital,wght@0,400..600;1,400..600&family=IM+Fell+English:ital@0;1&family=Jost:wght@300..500&display=swap"
    />
    <!-- JSON-LD and the static profile inside #root come from src/lib/seo.ts, see vite.config.ts -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
