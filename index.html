    />
    <script>
      // Set the theme before first paint so the page never flashes the wrong paper.
      ;(() => {
        let saved
        try {
          saved = localStorage.getItem('theme')
        } catch {}
        const uv = saved ? saved === 'uv' : matchMedia('(prefers-color-scheme: dark)').matches
        document.documentElement.dataset.theme = uv ? 'uv' : 'paper'
      })()
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
